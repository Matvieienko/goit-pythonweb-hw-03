<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved messages</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">
          <img src="/logo.png" alt="GoIT logo" />
        </a>
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item">
            <a class="nav-link" href="/message.html">Send message</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="/read">Messages</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="container py-4">
      <h1 class="mb-4">Saved messages</h1>
      {% if messages %}
        {% for timestamp, item in messages.items() %}
          <article class="card mb-3 shadow-sm">
            <div class="card-body">
              <h2 class="h5 card-title">{{ item.username }}</h2>
              <p class="card-text">{{ item.message }}</p>
              <time class="text-muted" datetime="{{ timestamp }}">
                {{ timestamp }}
              </time>
            </div>
          </article>
        {% endfor %}
      {% else %}
        <p class="alert alert-info">There are no saved messages yet.</p>
      {% endif %}
    </main>
  </body>
</html>
